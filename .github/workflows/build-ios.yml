name: Build iOS IPA (SideStore)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npx expo prebuild -p ios
      - name: Fix Node Path for Xcode
        run: sudo ln -s $(which node) /usr/local/bin/node || true
      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls | grep \.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Compilo il workspace: $WORKSPACE con schema: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            RCT_NO_LAUNCH_PACKAGER=1
      - name: Package into IPA
        run: |
          cd ios
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: Cartella .app non trovata."
            exit 1
          fi
          echo "App trovata in: $APP_PATH"
          mkdir -p Payload
          mv "$APP_PATH" Payload/
          zip -r MangaBase-v1.1.0.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaBase-IPA
          path: ios/MangaBase-v1.1.0.ipa